title: AI Search Visibility
order: 6
intro: Google Business Profile is the most underused local marketing tool in the world. For service-area businesses and physical locations, it's the first impression you make — we make sure it's a good one.
sections:
  - heading: Profile optimization
    body: Every field completed correctly, photos uploaded, categories set, and Q&A populated with real answers. We fix the basics that most profiles get wrong and keep them current.
  - heading: Local SEO
    body: NAP consistency across directories, local keyword targeting, and citation building — the foundation Google uses to decide whether your business is real and relevant.
  - heading: Review management
    body: Automated review requests, personalized response templates, and daily monitoring. 50 real reviews can triple your click-through rate from Maps.
  - heading: Maps ranking
    body: Proximity signals, category optimization, and post strategy that moves your listing up the map pack. We track position weekly and adjust tactics based on what's working.
faq:
  - q: How quickly will I see results?
    a: GBP optimization typically shows map ranking improvements within 4–8 weeks. Review volume takes longer — usually 3–6 months to build a meaningful baseline.
  - q: Can you manage multiple locations?
    a: Yes. Multi-location management is quoted per location with a bulk discount.
  - q: Do you handle review responses?
    a: Yes. We write personalized responses for every review — positive and negative — in your brand voice.
