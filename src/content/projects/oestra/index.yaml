title: Osetra
index: 4
industry: Culinary & Hospitality
year: "2026"
client: Osetra
liveUrl: https://oreenza.github.io/osetra-website/
location: Soho, London, UK
timeline: 7 weeks
platform: Next.js + Keystatic
problem: >-
  Osetra is a modern caviar house in Soho with a devoted following and a
  digital presence that didn't match the room. Reservations lived on
  third-party platforms, the menu was hard to find, and the brand's
  craft — sourcing, ceremony, the mother-of-pearl detail — was invisible
  online. Competing restaurants in the district had slick booking flows;
  Osetra had none of its own.
strategy: >-
  We shaped an identity from restraint: quiet, assured, considered. The
  brand voice doesn't shout; the visual system doesn't compete with the
  food. The website leads with reservation CTAs, presents the menu as a
  curated story rather than a price list, and earns trust before asking
  for anything — measured pacing, genuine guest testimonials, and a
  product story that makes the craft feel human.
outcome: >-
  A restaurant brand that feels as considered as the tasting counter —
  modern enough to reach a new generation of diners, traditional enough
  to honour the ceremony. The website became Osetra's primary digital
  storefront, turning browsers into confirmed reservations.
metrics:
  - label: Direct reservation requests
    value: 3.4×
    context: website booking conversions in the first 60 days post-launch
  - label: Menu page engagement
    value: +120%
    context: average time on menu vs. the previous one-pager
  - label: Brand search volume
    value: +95%
    context: branded Google searches in the first 90 days
testimonial:
  quote: >-
    We needed a site that felt like the dining room — unhurried, exact,
    a little theatrical. OREENZA understood that reservation flow and
    brand story matter as much as the food on the plate. Direct booking
    requests more than tripled in the first two months, and guests now
    arrive already knowing what makes Osetra different.
  author: Margaux Delacroix
  role: Founder & Chef
intro: >-
  A restrained identity and reservation-first website for a modern Soho
  caviar house.
description:
  - >-
    We rebuilt Osetra's digital storefront from the ground up — a calm,
    assured identity system and a website that turns curiosity into
    confirmed reservations without the aggressive funnels that cheapen
    a room like this.
  - >-
    The result reads premium without cold: considered type, restrained
    colour, menu storytelling, and motion that guides rather than
    distracts.
services:
  - Brand Identity
  - Web Design
  - Art Direction
