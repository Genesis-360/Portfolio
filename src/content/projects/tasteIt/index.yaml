title: TasteIt
index: 5
industry: Food & Beverage
year: "2026"
client: TasteIt
liveUrl: https://oreenza.github.io/tasteit-website/
location: San Francisco, California, USA
timeline: 10 weeks
platform: Next.js + Keystatic
problem: >-
  TasteIt had a bold concept — connecting food lovers with extraordinary
  culinary experiences — but a product that confused everyone who tried it.
  Users arrived, tapped a few things, and left without understanding what
  they were supposed to do next. Retention was below 12% at day 30. There
  was no social loop, no sense of momentum, and no reason to come back
  tomorrow. The discovery engine was actually hiding the discovery.
strategy: >-
  We redesigned the product around two verbs: explore and share. Bold
  colour to signal energy and differentiate from the clinical look of
  most food apps. Playful typography that makes the experience feel
  personal rather than transactional. Intuitive navigation where
  exploring is the default state — no tutorial required. Motion used
  deliberately: not decoration, but feedback that tells users their
  exploration is paying off.
outcome: >-
  A food discovery platform that feels alive. The act of discovering
  something new is itself the reward — which means users don't need
  a notification to come back. They just want to.
metrics:
  - label: Day-30 retention
    value: +340%
    context: users returning within 30 days, 60 days post-launch
  - label: Shares per session
    value: 3.1×
    context: discovery shares and saves per active session
  - label: Sessions per user per week
    value: +95%
    context: average weekly active sessions in the first 90 days
testimonial:
  quote: >-
    Users were arriving, tapping a few things, and leaving — retention was
    under 12% and nobody understood what to do next. OREENZA redesigned
    the whole experience around explore and share, and suddenly people
    come back on their own. Day-30 retention is up 340%, and the product
    finally feels as alive as the community around it.
  author: Alex Rivera
  role: Co-Founder
intro: >-
  A product redesign that turned confused first-time users into a habit
  people come back to on their own.
description:
  - >-
    TasteIt had a bold concept — connecting food lovers with extraordinary culinary experiences — but a product that confused everyone who tried it. We redesigned the experience around two verbs, explore and share, so discovery became the default state instead of a puzzle.
  - >-
    Bold colour, playful typography, and motion used as feedback (not decoration) make the platform feel alive. Day-30 retention climbed from under 12% to a 340% lift, and sharing became part of the loop rather than an afterthought.
