content:
  - "Every agency produces brand guidelines. Few agencies produce guidelines that get used. The difference is almost never the quality of the design — it's the specificity of the rules and the relevance of the examples. Vague guidelines like 'use the primary blue for headings' produce inconsistent results because different designers interpret 'primary blue' differently at 2am when they're working on a deadline."
  - "## Why Most Brand Guidelines Fail"
  - "The best brand guidelines we've seen are built around decisions, not directives. Instead of 'this is the typeface', it says 'we use this typeface at these sizes for these contexts because it reads well in both print and digital and carries the right level of formality for our audience.' That reasoning is what makes a rule stick when a designer faces an ambiguous situation the guidelines didn't anticipate."
  - "## What Makes Brand Guidelines Work"
  - "### Explain the Reasoning"
  - "Logo usage rules are almost universally inadequate. Most guidelines show the correct usage of the logo but never explain why the rules exist. When a designer is under pressure and the logo needs to fit in a narrow sidebar, they break the rule because they don't understand that the clear space rule exists to prevent the logo from competing with adjacent text."
  - "### Include Real-World Context"
  - "Colour specifications should include real-world context. Saying 'accent: #F63B05' is a start. Saying 'accent: #F63B05 — use for CTAs, highlights, and key interactive elements. Avoid using on backgrounds larger than 40% of the viewport. Never pair with navy blue (#1a2744) as this combination fails WCAG AA contrast at 4.2:1' gives a designer enough information to make good decisions independently."
  - "### Add a 'How to Break the Rules' Section"
  - "The single most useful thing in any brand guidelines is a 'how to break these rules' section. Not a licence to ignore the system — but explicit guidance on what constitutes an exception and how to handle it. Brands that never flex look rigid. Brands that flex without rules look incoherent. The best brands know exactly where they're rigid and where they can breathe."
  - "### Use Living Documents"
  - "We deliver brand guidelines as a living Notion or Figma file, not a PDF. PDFs go stale the day they're published. Interactive files can be updated, versioned, and annotated. The brand system that gets updated is the brand system that gets used."
  - "## How to Test Your Brand Guidelines"
  - "Give your brand guidelines to a designer who hasn't seen them before. Ask them to complete a real task. If they can produce consistent results independently, your guidelines work. If everything still looks different, the guidelines need more specificity."
faq:
  - q: Why do most brand guidelines fail?
    a: "Most brand guidelines are too vague without explaining the reasoning behind rules. When designers face ambiguous situations, they break rules they don't understand."
  - q: What should brand guidelines include?
    a: "Rules should explain the 'why' behind decisions, include real-world context and examples, and have a section on when and how to flex the rules."
  - q: Should brand guidelines be a PDF?
    a: "No. PDFs go stale immediately. Use living documents like Notion or Figma files that can be updated and versioned."
  - q: How do I know if my brand guidelines are effective?
    a: "If multiple designers can use them independently and produce consistent results, they're working."
