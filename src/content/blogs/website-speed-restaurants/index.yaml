title: Why Every Restaurant Website Should Load in Under 3 Seconds
excerpt: Speed isn't just a performance metric — it's a business decision. Here's why restaurant websites that load fast consistently outperform slower competitors in both search rankings and conversions.
quickAnswer: Restaurant websites should load in under 3 seconds on mobile. Every additional second of load time correlates with roughly 7% fewer reservations. The biggest culprits are oversized images, third-party widgets, and render-blocking resources.
keyTakeaways:
  - Target sub-2-second load times on mobile
  - Convert images to WebP at 80% quality
  - Use responsive srcset for mobile devices
  - Eliminate render-blocking third-party scripts
  - Lazy-load everything below the fold
