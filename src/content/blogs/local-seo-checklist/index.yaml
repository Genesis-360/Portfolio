title: The Local SEO Checklist We Run for Every New Hospitality Client
excerpt: Before we ever touch a design tool, we run this checklist. It's the foundation that determines whether the website we're building will actually get found.
quickAnswer: Local SEO for hospitality requires claiming your Google Business Profile, ensuring NAP consistency across directories, adding schema markup, and fixing technical SEO fundamentals before designing the website.
keyTakeaways:
  - Claim and optimize Google Business Profile first
  - Ensure NAP consistency across all directories
  - Add LocalBusiness schema markup
  - Fix Core Web Vitals before launch
  - Submit XML sitemap to Google Search Console
  - Respond to reviews within 24 hours
